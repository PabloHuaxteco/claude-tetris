<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a modo claro" title="Cambiar a modo claro">🌙</button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <!-- Pantalla de inicio -->
        <div id="screen-start" class="screen hidden">
          <p class="screen-title">TETRIS</p>
          <div id="start-records" class="records-slot"></div>
          <div id="start-skin" class="skin-slot"></div>
          <label class="menu-field">
            Nivel inicial
            <select id="start-level" class="menu-select"></select>
          </label>
          <button id="play-btn" class="menu-btn" type="button">JUGAR</button>
        </div>

        <!-- Menú de pausa -->
        <div id="screen-pause" class="screen hidden">
          <p class="screen-title">PAUSA</p>
          <button id="resume-btn" class="menu-btn" type="button">Reanudar</button>
          <button id="restart-btn" class="menu-btn" type="button">Reiniciar</button>
          <button id="controls-btn" class="menu-btn menu-btn--ghost" type="button" aria-expanded="false" aria-controls="controls-list">Ver controles</button>
          <ul id="controls-list" class="controls-list hidden">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída dura</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
          <label class="menu-field">
            Nivel inicial (próxima partida)
            <select id="pause-level" class="menu-select"></select>
          </label>
        </div>

        <!-- Game over -->
        <div id="screen-gameover" class="screen hidden">
          <p id="overlay-title" class="screen-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <div id="gameover-records" class="records-slot"></div>
          <button id="gameover-restart-btn" class="menu-btn" type="button">Reiniciar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
