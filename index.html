<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a modo claro" title="Cambiar a modo claro">🌙</button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="start-overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <div class="records" id="start-records"></div>
        <button id="play-btn">Jugar</button>
        <button id="reset-records-btn-start" class="secondary-btn" type="button">Resetear records</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="name-entry" class="name-entry hidden">
          <label for="player-name">¡Entras en el top! Escribe tu nombre:</label>
          <div class="name-entry-row">
            <input type="text" id="player-name" maxlength="12" placeholder="Nombre" autocomplete="off" />
            <button id="save-score-btn" type="button">Guardar</button>
          </div>
        </div>
        <div class="records" id="overlay-records"></div>
        <button id="restart-btn">Jugar de nuevo</button>
        <button id="reset-records-btn" class="secondary-btn" type="button">Resetear records</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden">
      <div class="overlay-box pause-box">
        <p class="pause-title">PAUSA</p>

        <div class="pause-actions">
          <button id="resume-btn" type="button">Reanudar</button>
          <button id="pause-restart-btn" type="button">Reiniciar</button>
          <button id="controls-btn" type="button" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
        </div>

        <div id="pause-controls" class="pause-controls hidden">
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar (soft drop)</li>
            <li><kbd>Space</kbd> caída dura</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>

        <div class="pause-level">
          <label for="start-level-select">Nivel inicial</label>
          <select id="start-level-select"></select>
          <span class="pause-hint">Se aplica al reiniciar</span>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
